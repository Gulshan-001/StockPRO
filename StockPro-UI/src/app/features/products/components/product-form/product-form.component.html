<div class="app-container bg-inventory animate">
  <div class="content-panel">
    <div class="form-header">
      <button class="back-link" (click)="onCancel()">
        <i class="fas fa-arrow-left"></i> Return to Catalog
      </button>
      <h1 class="page-title">{{ isEditMode ? 'Modify Product' : 'Register Product' }}</h1>
      <p class="subtitle">Enter technical specifications and market pricing attributes.</p>
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="zen-form">
      <div class="form-alert error" *ngIf="errorMessage">
        <i class="fas fa-circle-exclamation"></i> {{ errorMessage }}
      </div>

      <div class="form-card">
        <div class="grid-layout">
          <!-- Identity Section -->
          <div class="form-section">
            <h3 class="section-label">Identity & Branding</h3>
            
            <div class="field-group full">
              <label>Full Product Name*</label>
              <input type="text" formControlName="name" placeholder="e.g. Precision Lathe X-100">
              <span class="v-error" *ngIf="productForm.get('name')?.touched && productForm.get('name')?.errors?.['required']">Required</span>
            </div>

            <div class="field-row">
              <div class="field-group">
                <label>SKU Identifier*</label>
                <input type="text" formControlName="sku" placeholder="SKU-XXX-000">
              </div>
              <div class="field-group">
                <label>Barcode / GTIN</label>
                <input type="text" formControlName="barcode" placeholder="UPC-A / EAN-13">
              </div>
            </div>

            <div class="field-row">
              <div class="field-group">
                <label>Category</label>
                <input type="text" formControlName="category" placeholder="Electronics, Industrial...">
              </div>
              <div class="field-group">
                <label>Brand</label>
                <input type="text" formControlName="brand" placeholder="Official Brand Name">
              </div>
            </div>

            <div class="field-group full">
              <label>Detailed Description</label>
              <textarea formControlName="description" rows="4" placeholder="Mention key specs, materials, or features..."></textarea>
            </div>
          </div>

          <!-- Market & Inventory Section -->
          <div class="form-section">
            <h3 class="section-label">Market Value & Inventory</h3>

            <div class="field-row">
              <div class="field-group">
                <label>Cost Price ($)*</label>
                <input type="number" formControlName="costPrice">
              </div>
              <div class="field-group">
                <label>Selling Price ($)*</label>
                <input type="number" formControlName="sellingPrice">
              </div>
            </div>

            <div class="v-error full-width" *ngIf="productForm.errors?.['pricingError'] && productForm.get('sellingPrice')?.touched">
              Notice: Selling price must be greater than or equal to cost.
            </div>

            <div class="field-row">
              <div class="field-group">
                <label>Reorder Threshold*</label>
                <input type="number" formControlName="reorderLevel">
              </div>
              <div class="field-group">
                <label>Max Capacity*</label>
                <input type="number" formControlName="maxStockLevel">
              </div>
            </div>

            <div class="field-row">
              <div class="field-group">
                <label>Unit of Measure</label>
                <select formControlName="unitOfMeasure">
                  <option value="pcs">Pieces (pcs)</option>
                  <option value="kg">Kilograms (kg)</option>
                  <option value="box">Standard Box</option>
                  <option value="set">Custom Set</option>
                </select>
              </div>
              <div class="field-group">
                <label>Lead Time (Days)</label>
                <input type="number" formControlName="leadTimeDays">
              </div>
            </div>

            <div class="field-group checkbox-row" *ngIf="isEditMode">
              <label class="toggle-label">
                <input type="checkbox" formControlName="isActive">
                <div class="toggle-slider"></div>
                <span class="toggle-text">Active for ongoing inventory transactions</span>
              </label>
            </div>
          </div>
        </div>

        <div class="form-footer">
          <button type="button" class="btn btn-ghost" (click)="onCancel()" [disabled]="submitting">Discard Changes</button>
          <button type="submit" class="btn btn-primary" [disabled]="submitting || productForm.invalid">
            <span class="spinner-mini" *ngIf="submitting"></span>
            {{ submitting ? 'Finalizing...' : (isEditMode ? 'Commit Updates' : 'Confirm Registration') }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
