<div class="app-container bg-auth">
  
  <!-- Left Side: Login Form -->
  <div class="content-panel auth-panel animate">

    <h1 class="title" style="font-size: 28px;">Sign in</h1>
    <p class="subtitle">Access your inventory and manage operations with precision.</p>

    <div *ngIf="errorMessage" class="text-error" style="margin-bottom: 20px; font-weight: 500;">
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate style="max-width: 400px; width: 100%;">
      
      <div class="form-group">
        <label class="label">Email Address</label>
        <input type="email" formControlName="email" class="input" placeholder="name@company.com">
      </div>

      <div class="form-group">
        <label class="label">Password</label>
        <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="input" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isLoading" style="width: 100%; margin-top: 20px;">
        {{ isLoading ? 'Entering...' : 'Sign In' }}
      </button>

    </form>

    <p style="margin-top: 40px; font-size: 13px; color: var(--color-muted);">
      New to the platform? <a routerLink="/auth/register" style="color: #fff; font-weight: 600;">Create account</a>
    </p>
  </div>

  <!-- Right Side: Immersive Visual -->
  <div class="visual-panel">
  </div>

</div>
